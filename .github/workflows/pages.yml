# The installer page (site/) on GitHub Pages, with the latest release's firmware next to it (site/fw/).
# Settings -> Pages -> Source: GitHub Actions. It runs when site/ changes, after every build (so a new release shows
# up), and by hand.
name: pages
on:
  push:
    branches: [main]
    paths: ['site/**', 'case/**', '.github/workflows/pages.yml']
  workflow_run:
    workflows: [build]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: the latest release's firmware
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site/fw
          # the newest release that has its files (one made by hand gets them when its tag's build is done, and
          # that build deploys this again)
          tag=
          for t in $(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --json tagName -q '.[].tagName'); do
            if gh release download "$t" --repo "$GITHUB_REPOSITORY" --dir site/fw --clobber \
              --pattern 'fm1buddy-cyd-s3*.bin' 2>/dev/null && [ -f site/fw/fm1buddy-cyd-s3.bin ]; then
              tag=$t
              break
            fi
            rm -f site/fw/*
          done
          if [ -n "$tag" ]; then
            # each board's: the installer's manifest, and its .bin's sha256 in version.json (the board's own update
            # reads it: Settings > Update). The manifest writes the .bin in pieces, around the settings (NVS, 0x9000
            # to 0xE000), so an install keeps them (Wi-Fi's too); the whole .bin stays for the board's update
            files='{}'
            board() {  # file, name, manifest
              f=site/fw/$1
              [ -f "$f" ] || return 0
              b=${1%.bin}
              head -c $((0x9000)) "$f" > "site/fw/$b-boot.bin"
              tail -c +$((0xE000 + 1)) "$f" | head -c $((0x2000)) > "site/fw/$b-otadata.bin"
              tail -c +$((0x10000 + 1)) "$f" > "site/fw/$b-app.bin"
              jq -n --arg v "$tag" --arg name "$2" --arg b "$b" '{name: $name, version: $v,
                new_install_prompt_erase: true, builds: [{chipFamily: "ESP32-S3", parts: [
                  {path: ($b + "-boot.bin"), offset: 0},
                  {path: ($b + "-otadata.bin"), offset: 57344},
                  {path: ($b + "-app.bin"), offset: 65536}]}]}' > "site/fw/$3"
              files=$(jq -c --arg k "$1" --arg v "$(sha256sum "$f" | cut -d' ' -f1)" '. + {($k): $v}' <<<"$files")
            }
            board fm1buddy-cyd-s3.bin 'fm1buddy' manifest.json
            # the 3.5" board's, and the 4"'s, from the releases that have them
            board fm1buddy-cyd-s3-35.bin 'fm1buddy (3.5")' manifest-35.json
            board fm1buddy-cyd-s3-4.bin 'fm1buddy (4")' manifest-4.json
            jq -n --arg tag "$tag" --argjson files "$files" '{tag: $tag, files: $files}' > site/fw/version.json
            cat site/fw/version.json site/fw/manifest.json
          else
            rm -f site/fw/*
            echo "no release with firmware yet: the page says so"
          fi
      - name: the case's OpenSCAD file (the page makes the case's STLs from it, casemaker.js)
        run: mkdir -p site/fw && cp case/fm1buddy-case.scad site/fw/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

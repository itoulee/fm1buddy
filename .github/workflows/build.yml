# Builds the CYD-S3's firmware (the 2.8" and the 4"). Every run keeps it as a "firmware" artifact; tags (v0.2) also
# get a release with it attached. (The case's STLs are made on the installer page, from case/fm1buddy-case.scad.)
name: build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio esptool==4.8.1
      - run: tools/unit-test.sh
      # Settings > About shows it: the tag on a release, else the commit
      - run: pio run -e cyd-s3 -e cyd-s3-4
        env:
          PLATFORMIO_BUILD_FLAGS: -DFM1BUDDY_VERSION=\"${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.sha }}\"
      - run: |
          mkdir -p build
          cp .pio/build/cyd-s3/firmware.factory.bin build/fm1buddy-cyd-s3.bin
          cp .pio/build/cyd-s3-4/firmware.factory.bin build/fm1buddy-cyd-s3-4.bin
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/fm1buddy-cyd-s3.bin
            build/fm1buddy-cyd-s3-4.bin
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            build/fm1buddy-cyd-s3.bin
            build/fm1buddy-cyd-s3-4.bin
          fail_on_unmatched_files: true
